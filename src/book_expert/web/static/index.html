<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Expert</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4;
    --panel: #ffffff;
    --text: #17181a;
    --muted: #6b6f76;
    --line: #e2e3e0;
    --accent: #2f6f4f;
    --accent-ink: #ffffff;
    --user: #e8efe9;
    --error: #a3282b;
    --error-bg: #fbeaea;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517;
      --panel: #1c1e21;
      --text: #eceded;
      --muted: #9aa0a6;
      --line: #2c2f33;
      --accent: #6fbf92;
      --accent-ink: #10231a;
      --user: #24322a;
      --error: #ff8f8f;
      --error-bg: #3a1d1d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, textarea, button {
    font: inherit;
    color: inherit;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
  }
  select { padding: 7px 10px; max-width: 320px; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .modes button {
    border: 0;
    border-radius: 0;
    padding: 7px 14px;
    background: transparent;
    cursor: pointer;
    color: var(--muted);
  }
  .modes button.active { background: var(--accent); color: var(--accent-ink); }
  button.ghost { padding: 7px 10px; background: transparent; cursor: pointer; color: var(--muted); }
  button.ghost:hover { color: var(--text); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    scroll-behavior: smooth;
  }
  .thread { width: min(860px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: min(680px, 100%);
    padding: 11px 14px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user); border-color: transparent; }
  .bubble.markdown { white-space: normal; }
  .bubble.markdown p { margin: 0 0 8px; }
  .bubble.markdown p:last-child { margin-bottom: 0; }
  .bubble.markdown h1, .bubble.markdown h2, .bubble.markdown h3,
  .bubble.markdown h4, .bubble.markdown h5, .bubble.markdown h6 {
    margin: 12px 0 6px; line-height: 1.25; font-weight: 600;
  }
  .bubble.markdown h1 { font-size: 1.25em; }
  .bubble.markdown h2 { font-size: 1.15em; }
  .bubble.markdown h3 { font-size: 1.05em; }
  .bubble.markdown ul, .bubble.markdown ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble.markdown li { margin: 2px 0; }
  .bubble.markdown code {
    padding: 1px 4px; border-radius: 4px; background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.92em;
  }
  .bubble.markdown pre {
    margin: 0 0 8px; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); overflow-x: auto;
  }
  .bubble.markdown pre code { padding: 0; background: none; font-size: 0.9em; }
  .bubble.markdown blockquote {
    margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted);
  }
  .bubble.markdown a { color: var(--accent); }
  .bubble.markdown table { display: block; width: 100%; margin: 0 0 8px; border-collapse: collapse; overflow-x: auto; }
  .bubble.markdown th, .bubble.markdown td { padding: 4px 6px; border: 1px solid var(--line); text-align: left; }
  .bubble.markdown hr { margin: 10px 0; border: 0; border-top: 1px solid var(--line); }
  .meta { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .sources { max-width: min(680px, 100%); margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .sources-title {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    margin: 2px 0 0 4px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em; list-style: none;
  }
  .sources-title::-webkit-details-marker { display: none; }
  .sources-title::before { content: "▸"; color: var(--accent); font-size: 11px; }
  .sources[open] > .sources-title { margin-bottom: 6px; }
  .sources[open] > .sources-title::before { content: "▾"; }
  .citations { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; max-width: min(680px, 100%); }
  .cite-num { margin-right: 4px; color: var(--accent); font-weight: 600; }
  .citation {
    margin: 0;
    padding: 10px 12px;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    border-radius: 0 10px 10px 0;
    font-size: 14px;
  }
  .citation figcaption { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .citation blockquote { margin: 0; }
  .empty {
    width: min(860px, 100%);
    margin: 8vh auto 0;
    text-align: center;
    color: var(--muted);
  }
  .empty h1 { color: var(--text); font-size: 22px; margin: 0 0 8px; }
  .empty p { margin: 0 auto 6px; max-width: 520px; }
  .error {
    width: min(860px, calc(100% - 40px));
    margin: 0 auto 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--error-bg);
    color: var(--error);
    font-size: 14px;
  }
  footer { padding: 10px 20px 16px; }
  .composer { width: min(860px, 100%); margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    padding: 11px 14px;
    min-height: 46px;
    max-height: 200px;
    background: var(--panel);
  }
  textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #send {
    padding: 11px 18px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.55; cursor: default; }
  .hint { width: min(860px, 100%); margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .tab.active { background: var(--accent); color: var(--accent-ink); }
  .view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .view[hidden] { display: none; }
  .library { width: min(980px, 100%); margin: 0 auto; padding: 24px 20px; overflow-y: auto; }
  .lib-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .import-box { margin-bottom: 14px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .import-box .lib-title { margin-bottom: 8px; }
  .import-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
  #import-path { flex: 1; min-width: 260px; padding: 7px 10px; background: var(--bg); }
  .import-row button { padding: 7px 12px; background: var(--bg); cursor: pointer; }
  .import-row button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .import-row button:disabled { opacity: 0.5; cursor: default; }
  .lib-job-cancel { margin-left: 10px; padding: 2px 10px; font-size: 13px; background: var(--bg); cursor: pointer; }
  .progress { position: relative; height: 10px; margin-top: 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
  .progress.indeterminate > div { width: 35%; animation: progress-slide 1.2s ease-in-out infinite; }
  @keyframes progress-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .job-current { margin-top: 6px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
  .upload input[type=file] { max-width: 260px; }
  .lib-list { display: flex; flex-direction: column; gap: 10px; }
  .lib-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .lib-main { min-width: 220px; flex: 1; }
  .lib-title { font-weight: 600; overflow-wrap: anywhere; }
  .lib-sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .lib-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .lib-actions button { padding: 6px 10px; font-size: 14px; background: var(--bg); cursor: pointer; }
  .lib-actions button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .lib-actions button.danger { color: var(--error); }
  .lib-actions button:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .status.ready { color: var(--accent); border-color: var(--accent); }
  .status.failed { color: var(--error); border-color: var(--error); }
  .job { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; }
  .job.failed { color: var(--error); }
  .pending { color: var(--muted); font-size: 14px; padding: 0 4px; }
  .pending span { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (max-width: 640px) {
    header { padding: 10px 14px; }
    main { padding: 16px 14px 6px; }
    footer { padding: 8px 14px 12px; }
    .brand .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Book Expert <span class="sub">локальный чат по книгам</span></div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button type="button" class="tab active" data-tab="chat" role="tab" aria-selected="true">Чат</button>
    <button type="button" class="tab" data-tab="library" role="tab" aria-selected="false">Библиотека</button>
  </nav>
  <div class="controls" id="chat-controls">
    <select id="book" aria-label="Книга">
      <option value="">Все книги (авто-выбор)</option>
    </select>
    <div class="modes" role="group" aria-label="Режим ответа">
      <button type="button" data-mode="rag" class="active" aria-pressed="true">RAG</button>
      <button type="button" data-mode="agent" aria-pressed="false">Агент</button>
    </div>
    <button type="button" id="clear" class="ghost">Очистить</button>
  </div>
</header>

<div id="error" class="error" role="alert" hidden></div>

<div id="view-chat" class="view">
  <main id="messages" aria-live="polite">
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <form id="form" class="composer">
      <textarea id="input" rows="1" maxlength="4000" placeholder="Спросите о книге…" aria-label="Вопрос"></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>
    <div class="hint">Enter — отправить, Shift+Enter — новая строка. История хранится только в этом браузере.</div>
  </footer>
</div>

<div id="view-library" class="view" hidden>
  <main class="library">
    <div class="lib-toolbar">
      <div class="upload">
        <input type="file" id="upload-file" accept=".pdf,.epub,.fb2,.djvu,application/pdf,application/epub+zip" aria-label="Книга для загрузки">
        <label><input type="checkbox" id="upload-ingest"> сразу в RAG</label>
        <button type="button" id="upload-button" class="primary">Загрузить книгу</button>
      </div>
      <button type="button" id="lib-refresh" class="ghost">Обновить</button>
    </div>
    <div class="import-box">
      <div class="lib-title">Импорт книг из папки</div>
      <div class="import-row">
        <input type="text" id="import-path" placeholder="H:\DISK\Книги или /mnt/h/DISK/Книги" aria-label="Папка с книгами">
        <label><input type="checkbox" id="import-recursive" checked> рекурсивно</label>
        <label><input type="checkbox" id="import-ingest" checked> сразу в RAG</label>
        <button type="button" id="import-scan" class="primary">Проверить</button>
        <button type="button" id="import-start" disabled>Импортировать</button>
      </div>
      <div id="import-preview" class="lib-sub" hidden></div>
      <div id="import-progress" class="progress indeterminate" hidden><div></div></div>
    </div>
    <div id="lib-job" class="job" hidden></div>
    <div id="lib-list" class="lib-list"></div>
    <p class="hint">Книги (PDF, EPUB, FB2, DJVU) хранятся в data/raw/books. «Удалить файл» убирает и файл, и индекс.</p>
  </main>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "book-expert-chat-v1";
  const thread = document.getElementById("thread");
  const messagesPane = document.getElementById("messages");
  const bookSelect = document.getElementById("book");
  const modeButtons = Array.from(document.querySelectorAll(".modes button"));
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const clearButton = document.getElementById("clear");
  const errorBox = document.getElementById("error");
  const tabs = Array.from(document.querySelectorAll(".tab"));
  const views = {
    chat: document.getElementById("view-chat"),
    library: document.getElementById("view-library"),
  };
  const chatControls = document.getElementById("chat-controls");
  const libList = document.getElementById("lib-list");
  const libJob = document.getElementById("lib-job");
  const uploadFile = document.getElementById("upload-file");
  const uploadIngest = document.getElementById("upload-ingest");
  const uploadButton = document.getElementById("upload-button");
  const refreshButton = document.getElementById("lib-refresh");
  const importPath = document.getElementById("import-path");
  const importRecursive = document.getElementById("import-recursive");
  const importIngest = document.getElementById("import-ingest");
  const importScanButton = document.getElementById("import-scan");
  const importStartButton = document.getElementById("import-start");
  const importPreviewBox = document.getElementById("import-preview");
  const importProgress = document.getElementById("import-progress");

  const state = {
    mode: "rag",
    bookId: "",
    messages: [],
    pending: false,
    tab: "chat",
    library: [],
    libraryBusy: false,
    importPreview: null,
    importSource: null,
    scanToken: 0,
  };

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (Array.isArray(saved.messages)) {
        state.messages = saved.messages.filter(
          (item) =>
            item &&
            (item.role === "user" || item.role === "assistant") &&
            typeof item.text === "string"
        );
      }
      if (saved.mode === "rag" || saved.mode === "agent") state.mode = saved.mode;
      if (typeof saved.bookId === "string") state.bookId = saved.bookId;
      if (saved.tab === "chat" || saved.tab === "library") state.tab = saved.tab;
    } catch (error) {
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          mode: state.mode,
          bookId: state.bookId,
          tab: state.tab,
          messages: state.messages,
        })
      );
    } catch (error) {
      /* приватный режим или переполнение — история просто не сохранится */
    }
  }

  function showError(message) {
    if (!message) {
      errorBox.hidden = true;
      errorBox.textContent = "";
      return;
    }
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function applyMode() {
    for (const button of modeButtons) {
      const active = button.dataset.mode === state.mode;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    }
    input.placeholder =
      state.mode === "rag" ? "Спросите о книге…" : "Задача для агента…";
  }

  function renderEmpty() {
    const box = document.createElement("div");
    box.className = "empty";
    const title = document.createElement("h1");
    title.textContent = "Book Expert";
    const first = document.createElement("p");
    first.textContent =
      "Ответы строятся только по проиндексированным книгам, с цитатами на страницы.";
    const second = document.createElement("p");
    second.textContent =
      "RAG — быстрый ответ по фрагментам. Агент — react-цикл с поиском и инструментами.";
    box.append(title, first, second);
    return box;
  }

  function citationElement(citation, fallbackNumber) {
    const item = document.createElement("li");
    item.className = "citation";
    const caption = document.createElement("figcaption");
    const page = citation.page === undefined || citation.page === null ? "?" : citation.page;
    const format = (citation.format || "pdf").toLowerCase();
    let locator;
    if (format === "pdf" || format === "djvu") {
      locator = `стр. ${page}`;
    } else if (citation.section) {
      locator = citation.section;
    } else {
      locator = `фрагмент ${page}`;
    }
    const suffix = format === "pdf" ? "" : ` · ${format.toUpperCase()}`;
    const number = citation.number || fallbackNumber;
    const badge = document.createElement("span");
    badge.className = "cite-num";
    badge.textContent = `[${number}]`;
    caption.append(badge, document.createTextNode(`${citation.book_title || "Книга"} — ${locator}${suffix}`));
    item.append(caption);
    if (citation.quote) {
      const quote = document.createElement("blockquote");
      quote.textContent = citation.quote;
      item.append(quote);
    }
    return item;
  }

  const INLINE_PATTERN = /(`[^`\n]+`|\*\*[^*\n]+\*\*|~~[^~\n]+~~|\[[^\]\n]+\]\((?:[^()\n]|\([^)\n]*\))*\)|(?<![\w*])\*(?![\s*])[^*\n]+?(?<![\s*])\*(?![\w*]))/g;

  function appendPlain(parent, text) {
    const lines = String(text).split("\n");
    lines.forEach((line, index) => {
      if (index > 0) parent.append(document.createElement("br"));
      if (line) parent.append(document.createTextNode(line));
    });
  }

  function appendInline(parent, text) {
    for (const piece of String(text).split(INLINE_PATTERN)) {
      if (!piece) continue;
      if (piece.startsWith("**") && piece.endsWith("**") && piece.length > 4) {
        const strong = document.createElement("strong");
        appendInline(strong, piece.slice(2, -2));
        parent.append(strong);
      } else if (piece.startsWith("~~") && piece.endsWith("~~") && piece.length > 4) {
        const strike = document.createElement("del");
        appendInline(strike, piece.slice(2, -2));
        parent.append(strike);
      } else if (piece.startsWith("`") && piece.endsWith("`") && piece.length > 2) {
        const code = document.createElement("code");
        code.textContent = piece.slice(1, -1);
        parent.append(code);
      } else if (piece.startsWith("[") && piece.includes("](")) {
        const match = piece.match(/^\[([^\]]+)\]\(((?:[^()]|\([^)]*\))*)\)$/);
        if (!match) {
          appendPlain(parent, piece);
          continue;
        }
        const url = match[2].trim();
        if (/^(https?:\/\/|mailto:|\/(?!\/)|#)/i.test(url)) {
          const link = document.createElement("a");
          link.textContent = match[1];
          link.href = url;
          if (/^https?:/i.test(url)) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
          parent.append(link);
        } else {
          appendPlain(parent, match[1]);
        }
      } else if (piece.startsWith("*") && piece.endsWith("*") && piece.length > 2) {
        const em = document.createElement("em");
        appendInline(em, piece.slice(1, -1));
        parent.append(em);
      } else {
        appendPlain(parent, piece);
      }
    }
  }

  function isTableSeparator(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
  }

  function startsTable(lines, index) {
    return (
      index + 1 < lines.length &&
      lines[index].includes("|") &&
      isTableSeparator(lines[index + 1])
    );
  }

  function isBlockStart(line) {
    return (
      /^\s*```/.test(line) ||
      /^#{1,6}\s+/.test(line) ||
      /^\s*>/.test(line) ||
      /^\s*[-*+]\s+/.test(line) ||
      /^\s*\d+[.)]\s+/.test(line) ||
      /^\s*([-*_])\1{2,}\s*$/.test(line)
    );
  }

  function splitTableRow(line) {
    return line
      .trim()
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((cell) => cell.trim());
  }

  function renderMarkdown(text) {
    const fragment = document.createDocumentFragment();
    const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
    let index = 0;
    while (index < lines.length) {
      const line = lines[index];
      if (!line.trim()) {
        index += 1;
        continue;
      }

      const fence = line.match(/^\s*```(.*)$/);
      if (fence) {
        const codeLines = [];
        index += 1;
        while (index < lines.length && !/^\s*```\s*$/.test(lines[index])) {
          codeLines.push(lines[index]);
          index += 1;
        }
        if (index < lines.length) index += 1;
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        const language = (fence[1] || "")
          .trim()
          .split(/\s+/)[0]
          .replace(/[^\w+-]/g, "");
        if (language) code.className = `language-${language}`;
        code.textContent = codeLines.join("\n");
        pre.append(code);
        fragment.append(pre);
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const element = document.createElement(`h${heading[1].length}`);
        appendInline(element, heading[2]);
        fragment.append(element);
        index += 1;
        continue;
      }

      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
        fragment.append(document.createElement("hr"));
        index += 1;
        continue;
      }

      if (/^\s*>/.test(line)) {
        const quoteLines = [];
        while (index < lines.length && /^\s*>/.test(lines[index])) {
          quoteLines.push(lines[index].replace(/^\s*>\s?/, ""));
          index += 1;
        }
        const quote = document.createElement("blockquote");
        quote.append(renderMarkdown(quoteLines.join("\n")));
        fragment.append(quote);
        continue;
      }

      if (startsTable(lines, index)) {
        const table = document.createElement("table");
        const head = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const cell of splitTableRow(lines[index])) {
          const th = document.createElement("th");
          appendInline(th, cell);
          headRow.append(th);
        }
        head.append(headRow);
        table.append(head);
        index += 2;
        const body = document.createElement("tbody");
        while (index < lines.length && lines[index].trim() && lines[index].includes("|")) {
          const row = document.createElement("tr");
          for (const cell of splitTableRow(lines[index])) {
            const td = document.createElement("td");
            appendInline(td, cell);
            row.append(td);
          }
          body.append(row);
          index += 1;
        }
        table.append(body);
        fragment.append(table);
        continue;
      }

      const ordered = /^\s*\d+[.)]\s+/.test(line);
      if (ordered || /^\s*[-*+]\s+/.test(line)) {
        const list = document.createElement(ordered ? "ol" : "ul");
        const marker = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
        while (index < lines.length && marker.test(lines[index])) {
          const item = document.createElement("li");
          appendInline(item, lines[index].replace(marker, ""));
          list.append(item);
          index += 1;
        }
        fragment.append(list);
        continue;
      }

      const paragraphLines = [];
      while (
        index < lines.length &&
        lines[index].trim() &&
        !isBlockStart(lines[index]) &&
        !startsTable(lines, index)
      ) {
        paragraphLines.push(lines[index]);
        index += 1;
      }
      if (!paragraphLines.length) {
        index += 1;
        continue;
      }
      const paragraph = document.createElement("p");
      appendInline(paragraph, paragraphLines.join("\n"));
      fragment.append(paragraph);
    }
    return fragment;
  }

  function messageElement(message) {
    const wrapper = document.createElement("article");
    wrapper.className = `msg ${message.role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (message.role === "assistant" && !message.error) {
      bubble.classList.add("markdown");
      bubble.append(renderMarkdown(message.text));
    } else {
      bubble.textContent = message.text;
    }
    if (message.error) bubble.style.color = "var(--error)";
    wrapper.append(bubble);

    if (message.role === "assistant") {
      if (message.refused) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Недостаточно контекста";
        wrapper.append(badge);
      }
      const citations = (message.citations || []).filter(Boolean);
      if (citations.length) {
        const sources = document.createElement("details");
        sources.className = "sources";
        const title = document.createElement("summary");
        title.className = "sources-title";
        title.textContent = `Источники (${citations.length})`;
        const list = document.createElement("ol");
        list.className = "citations";
        citations.forEach((citation, index) => {
          list.append(citationElement(citation, index + 1));
        });
        sources.append(title, list);
        bubble.append(sources);
      }
      if (message.mode || message.elapsed_ms !== undefined) {
        const meta = document.createElement("div");
        meta.className = "meta";
        const parts = [];
        if (message.mode) parts.push(message.mode === "rag" ? "RAG" : "агент");
        if (typeof message.elapsed_ms === "number") parts.push(`${(message.elapsed_ms / 1000).toFixed(1)} с`);
        meta.textContent = parts.join(" · ");
        wrapper.append(meta);
      }
    }
    return wrapper;
  }

  function pendingElement() {
    const wrapper = document.createElement("article");
    wrapper.className = "msg assistant";
    const pending = document.createElement("div");
    pending.className = "pending";
    const dots = document.createElement("span");
    dots.textContent = state.mode === "rag" ? "Ищу по книге…" : "Агент работает…";
    pending.append(dots);
    wrapper.append(pending);
    return wrapper;
  }

  function render() {
    thread.replaceChildren();
    if (!state.messages.length) {
      thread.append(renderEmpty());
    } else {
      for (const message of state.messages) thread.append(messageElement(message));
    }
    if (state.pending) thread.append(pendingElement());
    sendButton.disabled = state.pending;
    messagesPane.scrollTop = messagesPane.scrollHeight;
  }

  function persistAndRender() {
    saveState();
    render();
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
  }

  async function ask(text) {
    const mode = state.mode;
    const bookIds = state.bookId ? [state.bookId] : [];
    state.messages.push({ role: "user", text });
    state.pending = true;
    showError("");
    persistAndRender();
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, mode, book_ids: bookIds }),
      });
      let data = {};
      try {
        data = await response.json();
      } catch (error) {
        data = {};
      }
      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : `HTTP ${response.status}`;
        throw new Error(detail);
      }
      state.messages.push({
        role: "assistant",
        text: data.answer || "Пустой ответ.",
        refused: Boolean(data.refused),
        citations: Array.isArray(data.citations) ? data.citations : [],
        mode: data.mode || mode,
        elapsed_ms: data.elapsed_ms,
      });
    } catch (error) {
      state.messages.push({
        role: "assistant",
        text: `Ошибка: ${error.message || error}`,
        error: true,
      });
    } finally {
      state.pending = false;
      persistAndRender();
      input.focus();
    }
  }

  async function refreshBooks() {
    try {
      const response = await fetch("/api/books");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const books = await response.json();
      const known = new Set();
      const auto = document.createElement("option");
      auto.value = "";
      auto.textContent = "Все книги (авто-выбор)";
      bookSelect.replaceChildren(auto);
      for (const book of books) {
        known.add(book.id);
        const option = document.createElement("option");
        option.value = book.id;
        option.textContent = `${book.title} (${book.pages} стр.)`;
        bookSelect.append(option);
      }
      if (state.bookId && !known.has(state.bookId)) state.bookId = "";
      bookSelect.value = state.bookId;
    } catch (error) {
      showError(`Не удалось загрузить список книг: ${error.message || error}`);
    }
  }

  const STATUS_LABELS = {
    ready: "в RAG",
    failed: "ошибка",
    not_indexed: "не в RAG",
    indexing: "индексируется",
    pending: "ожидает индексации",
  };

  function formatSize(bytes) {
    if (typeof bytes !== "number") return "—";
    if (bytes >= 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} МБ`;
    return `${Math.max(1, Math.round(bytes / 1024))} КБ`;
  }

  function statusBadge(item) {
    const badge = document.createElement("span");
    badge.className = `status ${item.in_rag ? "ready" : item.status === "failed" ? "failed" : ""}`;
    badge.textContent = item.in_rag ? "в RAG" : STATUS_LABELS[item.status] || item.status;
    return badge;
  }

  function actionButton(label, action, item, options = {}) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    if (options.primary) button.classList.add("primary");
    if (options.danger) button.classList.add("danger");
    button.disabled = state.libraryBusy;
    button.addEventListener("click", () => runLibraryAction(action, item, Boolean(options.force)));
    return button;
  }

  function libraryRow(item) {
    const row = document.createElement("div");
    row.className = "lib-row";

    const main = document.createElement("div");
    main.className = "lib-main";
    const title = document.createElement("div");
    title.className = "lib-title";
    title.textContent = item.title;
    title.append(" ", statusBadge(item));
    const sub = document.createElement("div");
    sub.className = "lib-sub";
    const parts = [
      (item.format || "pdf").toUpperCase(),
      item.name,
      formatSize(item.size_bytes),
      item.pages ? `${item.pages} стр.` : null,
      item.chunks ? `${item.chunks} чанков` : null,
    ].filter(Boolean);
    sub.textContent = parts.join(" · ") + (item.file_exists ? "" : " · файл не найден");
    if (item.error) sub.textContent += ` · ${item.error}`;
    main.append(title, sub);

    const actions = document.createElement("div");
    actions.className = "lib-actions";
    if (item.file_exists && item.status === "failed") {
      actions.append(actionButton("Повторить", "ingest", item, { primary: true }));
    } else if (item.file_exists && item.in_rag) {
      actions.append(actionButton("Переиндексировать", "ingest", item, { force: true }));
    } else if (item.file_exists) {
      actions.append(actionButton("В RAG", "ingest", item, { primary: true }));
    }
    if (item.book_id) {
      actions.append(actionButton("Убрать из RAG", "remove", item, { danger: true }));
    }
    if (item.file_exists) {
      actions.append(actionButton("Удалить файл", "delete", item, { danger: true }));
    }
    row.append(main, actions);
    return row;
  }

  function renderLibrary() {
    libList.replaceChildren();
    if (!state.library.length) {
      const empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "Библиотека пуста — загрузите PDF.";
      libList.append(empty);
      return;
    }
    for (const item of state.library) libList.append(libraryRow(item));
  }

  async function loadLibrary() {
    try {
      const response = await fetch("/api/library");
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error((data && data.detail) || `HTTP ${response.status}`);
      }
      state.library = Array.isArray(data) ? data : [];
      renderLibrary();
      updateImportControls();
    } catch (error) {
      showError(`Не удалось загрузить библиотеку: ${error.message || error}`);
    }
  }

  function showJob(job) {
    libJob.hidden = false;
    libJob.classList.toggle("failed", job.status === "failed");
    libJob.replaceChildren();
    const statusLabel = {
      queued: "в очереди",
      running: "выполняется",
      done: "готово",
      failed: "ошибка",
      cancelled: "отменено",
    }[job.status] || job.status;
    if (job.kind === "import") {
      const processed = Math.min(job.processed ?? 0, job.total || 0);
      const percent = job.total > 0 ? Math.floor((processed / job.total) * 100) : 0;
      const parts = [
        `Импорт книг: ${percent}% (${processed}/${job.total})`,
        `скопировано ${job.copied}`,
        `в RAG ${job.ingested}`,
      ];
      if (job.failed) parts.push(`ошибок ${job.failed}`);
      if (job.remaining) parts.push(`останется ${job.remaining}`);
      parts.push(statusLabel);
      const label = document.createElement("span");
      label.textContent = parts.join(" · ");
      libJob.append(label);
      const progress = document.createElement("div");
      progress.className = "progress";
      const fill = document.createElement("div");
      fill.style.width = `${percent}%`;
      progress.append(fill);
      libJob.append(progress);
      if (job.current && job.status === "running") {
        const current = document.createElement("div");
        current.className = "job-current";
        current.textContent = `Сейчас: ${job.current}`;
        libJob.append(current);
      }
    } else {
      const kind = job.kind === "reindex" ? "Переиндексация" : "Индексация";
      const label = document.createElement("span");
      label.textContent = `${kind}: ${job.name} — ${statusLabel}${job.error ? `: ${job.error}` : ""}`;
      libJob.append(label);
    }
    if (
      job.kind === "import" &&
      (job.status === "queued" || job.status === "running")
    ) {
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "lib-job-cancel";
      cancel.textContent = "Отменить";
      cancel.addEventListener("click", () => cancelJob(job.id));
      libJob.append(cancel);
    }
  }

  let pollTimer = null;

  function pollJob(jobId) {
    if (pollTimer) clearTimeout(pollTimer);
    state.libraryBusy = true;
    renderLibrary();
    const tick = async () => {
      try {
        const response = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`);
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(job.detail || `HTTP ${response.status}`);
        }
        showJob(job);
        if (job.status === "queued" || job.status === "running") {
          pollTimer = setTimeout(tick, 1500);
          return;
        }
        state.libraryBusy = false;
        if (job.kind === "import") {
          state.importPreview = null;
          state.importSource = null;
          importPreviewBox.hidden = true;
          importPreviewBox.textContent = "";
          if (job.errors && job.errors.length) {
            showError(`Импорт завершён с ошибками: ${job.errors[0]}`);
          }
        }
        await loadLibrary();
        await refreshBooks();
        updateImportControls();
        if (job.status === "failed") {
          showError(`Индексация не удалась: ${job.error || "неизвестная ошибка"}`);
        }
      } catch (error) {
        state.libraryBusy = false;
        renderLibrary();
        updateImportControls();
        showError(`Не удалось получить статус задачи: ${error.message || error}`);
      }
    };
    tick();
  }

  async function runLibraryAction(action, item, force) {
    if (state.libraryBusy) return;
    if (
      action === "delete" &&
      !window.confirm(`Удалить файл «${item.name}» вместе с индексом?`)
    ) {
      return;
    }
    if (
      action === "remove" &&
      !window.confirm(`Убрать «${item.title}» из RAG? Файл останется на диске.`)
    ) {
      return;
    }
    showError("");
    state.libraryBusy = true;
    renderLibrary();
    let started = false;
    try {
      if (action === "ingest") {
        const response = await fetch("/api/library/ingest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: item.name, force }),
        });
        const job = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(job.detail || `HTTP ${response.status}`);
        started = true;
        await loadLibrary();
        pollJob(job.id);
        return;
      }
      const url =
        action === "remove"
          ? "/api/library/remove-from-rag"
          : "/api/library/delete-file";
      const payload = action === "remove" ? { book_id: item.book_id } : { name: item.name };
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      await loadLibrary();
      await refreshBooks();
    } catch (error) {
      showError(`Не удалось выполнить действие: ${error.message || error}`);
    } finally {
      if (!started) {
        state.libraryBusy = false;
        renderLibrary();
      }
    }
  }

  async function uploadPdf() {
    if (state.libraryBusy) return;
    const file = uploadFile.files && uploadFile.files[0];
    if (!file) {
      showError("Выберите файл книги.");
      return;
    }
    if (!/\.(pdf|epub|fb2|djvu)$/i.test(file.name)) {
      showError("Поддерживаются PDF, EPUB, FB2 и DJVU.");
      return;
    }
    const body = new FormData();
    body.append("file", file);
    body.append("ingest", uploadIngest.checked ? "true" : "false");
    showError("");
    state.libraryBusy = true;
    renderLibrary();
    uploadButton.disabled = true;
    try {
      const response = await fetch("/api/library/upload", { method: "POST", body });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      uploadFile.value = "";
      await loadLibrary();
      await refreshBooks();
      if (data.job) {
        pollJob(data.job.id);
      } else {
        state.libraryBusy = false;
        renderLibrary();
        if (data.note) showError(data.note);
      }
    } catch (error) {
      state.libraryBusy = false;
      renderLibrary();
      showError(`Не удалось загрузить файл: ${error.message || error}`);
    } finally {
      uploadButton.disabled = false;
    }
  }

  function updateImportControls() {
    importScanButton.disabled = state.libraryBusy;
    importStartButton.disabled =
      state.libraryBusy ||
      !state.importPreview ||
      state.importPreview.to_copy <= 0;
  }

  function resetImportPreview() {
    state.scanToken += 1;
    state.importPreview = null;
    state.importSource = null;
    importPreviewBox.hidden = true;
    importPreviewBox.textContent = "";
    updateImportControls();
  }

  async function scanImport() {
    if (importScanButton.disabled) return;
    const path = importPath.value.trim();
    if (!path) {
      showError("Укажите папку с PDF.");
      return;
    }
    const recursive = importRecursive.checked;
    const token = ++state.scanToken;
    showError("");
    state.importPreview = null;
    state.importSource = null;
    updateImportControls();
    importPreviewBox.hidden = false;
    importPreviewBox.textContent = "Сканирую папку…";
    importProgress.hidden = false;
    importScanButton.disabled = true;
    try {
      const response = await fetch("/api/library/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, recursive }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      if (token !== state.scanToken) return;
      state.importPreview = data;
      state.importSource = { path, recursive };
      const batch = data.batch_size ?? data.to_copy;
      const parts = [
        `книг: ${data.book_count ?? data.pdf_count}`,
        `к обработке: ${batch} (${formatSize(data.batch_bytes ?? data.total_bytes)})`,
        `уже есть: ${data.already_present}`,
        `пропуск: ${data.skipped}`,
      ];
      if (data.remaining) parts.push(`останется: ${data.remaining}`);
      importPreviewBox.textContent = parts.join(" · ");
    } catch (error) {
      importPreviewBox.hidden = true;
      importPreviewBox.textContent = "";
      showError(`Не удалось просканировать папку: ${error.message || error}`);
    } finally {
      importProgress.hidden = true;
      importScanButton.disabled = false;
      updateImportControls();
    }
  }

  async function startImport() {
    if (!state.importPreview || !state.importSource || state.libraryBusy) return;
    const { path, recursive } = state.importSource;
    const preview = state.importPreview;
    const ingest = importIngest.checked;
    const batch = preview.batch_size ?? preview.to_copy;
    let question = `Обработать ${batch} книг (${formatSize(preview.batch_bytes ?? preview.total_bytes)})${ingest ? " и проиндексировать" : ""}?`;
    if (preview.remaining) {
      question += ` Остальные ${preview.remaining} — следующим запуском.`;
    }
    if (!window.confirm(question)) return;
    showError("");
    state.libraryBusy = true;
    updateImportControls();
    try {
      const response = await fetch("/api/library/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          path,
          recursive,
          ingest,
        }),
      });
      const job = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(job.detail || `HTTP ${response.status}`);
      showJob(job);
      pollJob(job.id);
    } catch (error) {
      state.libraryBusy = false;
      updateImportControls();
      showError(`Не удалось запустить импорт: ${error.message || error}`);
    }
  }

  async function cancelJob(jobId) {
    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}/cancel`,
        { method: "POST" }
      );
      const job = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(job.detail || `HTTP ${response.status}`);
      showJob(job);
    } catch (error) {
      showError(`Не удалось отменить импорт: ${error.message || error}`);
    }
  }

  function applyTab() {
    for (const tab of tabs) {
      const active = tab.dataset.tab === state.tab;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
    }
    for (const [name, view] of Object.entries(views)) {
      view.hidden = name !== state.tab;
    }
    chatControls.hidden = state.tab !== "chat";
    if (state.tab === "library") {
      loadLibrary();
    } else {
      input.focus();
    }
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      state.tab = tab.dataset.tab === "library" ? "library" : "chat";
      saveState();
      applyTab();
    });
  });

  uploadButton.addEventListener("click", uploadPdf);
  refreshButton.addEventListener("click", loadLibrary);
  importScanButton.addEventListener("click", scanImport);
  importStartButton.addEventListener("click", startImport);
  importPath.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      scanImport();
    }
  });
  importPath.addEventListener("input", resetImportPreview);
  importRecursive.addEventListener("change", resetImportPreview);

  modeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      applyMode();
      saveState();
    });
  });

  bookSelect.addEventListener("change", () => {
    state.bookId = bookSelect.value;
    saveState();
  });

  clearButton.addEventListener("click", () => {
    if (!state.messages.length) return;
    if (!window.confirm("Очистить историю диалога в этом браузере?")) return;
    state.messages = [];
    persistAndRender();
    input.focus();
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || state.pending) return;
    input.value = "";
    autoGrow();
    ask(text);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener("input", autoGrow);

  loadState();
  applyMode();
  applyTab();
  bookSelect.value = state.bookId;
  render();
  refreshBooks();
  updateImportControls();
  input.focus();
})();
</script>
</body>
</html>
