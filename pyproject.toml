[project]
name = "book-expert"
version = "0.1.0"
description = "Local observable book-only RAG expert — foundation bootstrap."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "pymorphy3>=2.0.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[project.scripts]
book-expert = "book_expert.cli:app"

[project.optional-dependencies]
docling = [
    "docling>=2.145.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_expert"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["book_expert"]
